<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter">
<link rel="stylesheet" href="css/timeline.css">
<link rel="stylesheet" href="css/topnav.css">
<link rel="stylesheet" href="css/table.css">
<link rel="stylesheet" href="css/campaigns.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="css/archive.css">
<link rel="stylesheet" href="css/campaign-hub.css">
  <title>Pathfinder Timeline</title>
</head>
<body>
<nav class="archive-nav" aria-label="Main navigation">
  <a href="campaigns.html">Campaigns</a>
  <a href="index.html">Combined timeline</a>
</nav>
<main>
  <header class="hub-header" id="hub-header" hidden>
    <div class="hub-title">
      <span id="hub-symbol" aria-hidden="true"></span>
      <h1 id="hub-name"></h1>
    </div>
    <section id="characters" aria-label="Campaign characters" hidden></section>
  </header>
  <div class="timeline-layout">
    <aside class="hub-sidebar" id="hub-sidebar" hidden>
      <h2>Campaign overview</h2>
      <dl id="hub-details"></dl>
      <nav class="hub-sections" id="hub-sections" aria-label="Campaign sections" hidden>
        <ul>
          <li><a href="#timeline" aria-current="location"><span class="fa fa-hourglass-half" aria-hidden="true"></span>Timeline</a></li>
        </ul>
      </nav>
    </aside>
    <div class="timeline-panel">
      <div class="timeline-controls" id="timeline-controls" hidden>
        <label><input type="checkbox" id="show-history" checked aria-controls="timeline"> Show Historical Entries</label>
      </div>
      <section id="timeline" aria-label="Golarion timeline"></section>
    </div>
  </div>
</main>
<script src="js/timeline.js" type="module"></script>
</body>
</html>
